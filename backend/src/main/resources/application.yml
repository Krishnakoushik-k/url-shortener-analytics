spring:
  application:
    name: url-shortener-analytics

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/urlshortener?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${DB_USERNAME:urlapp}"
    password: "${DB_PASSWORD:}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: ${REDIS_PORT:6379}
      password: "${REDIS_PASSWORD:}"

  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  base-url: "${APP_BASE_URL:http://localhost:8080}"
  jwt:
    secret: "${JWT_SECRET:}"
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    url: /v3/api-docs

logging:
  level:
    com.portfolio.urlshortener: INFO
